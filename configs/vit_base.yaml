model_name: vit_base
pretrained: true
num_classes: 43
input_size: 224
batch_size: 16          # ← ViT тяжелее, батч меньше
epochs: 10
lr: 0.00005             # ← для ViT lr обычно меньше
weight_decay: 0.0001
early_stopping_patience: 3
num_workers: 4
seed: 42

data:
  root: data/raw/GTSRB
  val_split: 0.2